# Riccon SDD 权限单一事实源。
# 由 scripts/sync-agents.mjs 写入各 agent frontmatter；doctor 检查漂移。
# 规则顺序：base → subagents → 角色特定；OpenCode 以最后匹配为准。

base:
  - action: read
    resource: "*"
    effect: allow
  - action: read
    resource: .env
    effect: ask
  - action: read
    resource: .env.*
    effect: ask
  - action: read
    resource: "**/.env"
    effect: ask
  - action: read
    resource: "**/.env.*"
    effect: ask
  - action: read
    resource: "**/*.pem"
    effect: ask
  - action: read
    resource: "**/*.key"
    effect: ask
  - action: read
    resource: "**/id_rsa*"
    effect: ask
  - action: read
    resource: "**/id_ed25519*"
    effect: ask

  - action: edit
    resource: "*"
    effect: allow
  - action: edit
    resource: AGENTS.md
    effect: ask
  - action: edit
    resource: .opencode/**
    effect: ask
  - action: edit
    resource: .git/**
    effect: ask
  - action: edit
    resource: .env
    effect: ask
  - action: edit
    resource: .env.*
    effect: ask
  - action: edit
    resource: "**/.env"
    effect: ask
  - action: edit
    resource: "**/.env.*"
    effect: ask
  - action: edit
    resource: "**/*.pem"
    effect: ask
  - action: edit
    resource: "**/*.key"
    effect: ask
  - action: edit
    resource: .sdd/evidence/**
    effect: deny

  - action: shell
    resource: "*"
    effect: allow
  - action: shell
    resource: "rm *"
    effect: ask
  - action: shell
    resource: "rmdir *"
    effect: ask
  - action: shell
    resource: "git reset --hard*"
    effect: ask
  - action: shell
    resource: "git clean*"
    effect: ask
  - action: shell
    resource: "git push*"
    effect: ask
  - action: shell
    resource: "git rebase*"
    effect: ask
  - action: shell
    resource: "git filter-*"
    effect: ask
  - action: shell
    resource: "git restore*"
    effect: ask
  - action: shell
    resource: "git checkout --*"
    effect: ask
  - action: shell
    resource: "git branch -D*"
    effect: ask
  - action: shell
    resource: "git tag -d*"
    effect: ask
  - action: shell
    resource: "docker prune*"
    effect: ask
  - action: shell
    resource: "docker rm*"
    effect: ask
  - action: shell
    resource: "docker push*"
    effect: ask
  - action: shell
    resource: "kubectl delete*"
    effect: ask
  - action: shell
    resource: "helm uninstall*"
    effect: ask
  - action: shell
    resource: "terraform destroy*"
    effect: ask
  - action: shell
    resource: "terraform apply*"
    effect: ask
  - action: shell
    resource: "npm publish*"
    effect: ask
  - action: shell
    resource: "npm install -g*"
    effect: ask
  - action: shell
    resource: "chmod -R*"
    effect: ask
  - action: shell
    resource: "chown -R*"
    effect: ask
  - action: shell
    resource: "dd *"
    effect: ask
  - action: shell
    resource: "mkfs*"
    effect: ask
  - action: shell
    resource: "shutdown*"
    effect: ask
  - action: shell
    resource: "reboot*"
    effect: ask
  - action: shell
    resource: "sudo *"
    effect: ask
  - action: shell
    resource: "*decision answer*"
    effect: ask
  - action: shell
    resource: "*upgrade*--write*"
    effect: ask

  - action: external_directory
    resource: "*"
    effect: ask
  - action: skill
    resource: "*"
    effect: allow
  - action: webfetch
    resource: "*"
    effect: allow
  - action: websearch
    resource: "*"
    effect: allow

lead:
  - action: subagent
    resource: "*"
    effect: deny
  - action: subagent
    resource: "sdd/*"
    effect: allow
  - action: question
    resource: "*"
    effect: allow

subagents:
  - action: subagent
    resource: "*"
    effect: deny
  - action: question
    resource: "*"
    effect: deny
  - action: shell
    resource: "*task new*"
    effect: ask
